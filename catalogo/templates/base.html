<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TodoTech SAC{% endblock %}</title>
    <!-- CSS Global unificado -->
    <link rel="stylesheet" href="{% load static %}{% static 'css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Barra de Navegación Compartida -->
    <header>
        <div class="nav-container">
            <a href="{% url 'landing' %}" class="logo-text">TodoTech SAC</a>
            <ul class="nav-links">
                <li><a href="{% url 'landing' %}">Inicio</a></li>
                <li><a href="{% url 'lista_items' %}">Catálogo</a></li>
                <li><a href="{% url 'landing' %}#contacto">Contacto</a></li>
                <li><a href="{% url 'lista_items' %}" class="nav-cta">Ver Tienda</a></li>
            </ul>
        </div>
    </header>

    <!-- Contenido Dinámico de cada Vista -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de Página Compartido -->
    <footer>
        <p>&copy; 2026 TodoTech SAC. Todos los derechos reservados. Presencia digital esencial.</p>
    </footer>

    <!-- Scripts opcionales por página -->
    {% block extra_js %}{% endblock %}
</body>
</html>
